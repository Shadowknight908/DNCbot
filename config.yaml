# =====================================================================
# DNC Lore Bot — configuration (v0.8)
# =====================================================================

bot:
  command_prefix: "!DNC"
  min_message_length: 100       # minimum chars for text-only posts
  min_image_message_length: 10  # minimum chars for posts with an image attached
  
  # Multi-part post grouping: consecutive messages from the same author in the same
  # channel within this window are buffered and ingested as one combined memory.
  # !DNC gm also uses this window to detect split actions.
  chain_delay_seconds: 30

  # Multi-turn reply support
  conversation:
    # Max number of prior messages included as context when reconstructing
    # a reply chain.
    max_chain_depth: 5
    # Per-message char cap when including history. Current message is
    # NEVER truncated — only prior messages.
    max_history_message_chars: 2000

  # Year rollover scheduling
  year_rollover:
    enabled: false
    interval_days: 7
    announcement_channels:
      - "announcements"
    announcement_template: |
        **It is now {year}.**
    year_check_channel: ""

discord:
  # --- CHANNELS ---
  channels:
    # Non-command messages in these channels are ingested into memory.
    scan:
      - "🌎international-affairs🌎"
      - "🏠domestic-actions🏠"
      - "📰news📰"
      - "🪖military-actions🪖"
      - "🏭production🏭"
      - "🧪research🧪"
      - "🤫secret-actions🤫"
    # These channels are never scanned, even if scan: is empty (scan all).
    ignored:
      - "off-topic"
      - "memes"
      - "bot-spam"
      - "bot-commands"
    # Admin commands only work in these channels.
    admin:
      - "⚙bot-log⚙"
      - "staff-chat"
      - "shhh"

  # --- ROLE-BASED PERMISSIONS ---
  # Names are matched case-insensitively against Discord role names.
  roles:
    # Manage Server permission ALSO grants admin powers as a fallback.
    admin:
      - "Administrators"
    # Roles allowed to use !DNC chatuc from any channel.
    # Falls back to admin roles if empty.
    chatuc:
      - "Central Arbiter"

# --- GM MODE SETTINGS ---
gm:
  # Roles allowed to use !DNC gm and revise rulings by replying.
  # Falls back to admin roles if empty.
  roles:
    - "Department of GMs"
    - "Nations"
  # Channels where !DNC gm can be invoked. If empty, allowed from any channel.
  channels:
    - "🎲gm-requests🎲"
  # Channel where GM rulings are posted. If empty, bot replies in the invoking channel.
  output_channel: "🎰gm-answers🎰"
  # Retrieval tuning. All values are read at call time with the defaults shown.
  retrieval:
    # How many of the author's most recent prior posts to pull chronologically.
    author_recency_top_n: 30
    # How many additional prior posts to pull by semantic similarity to the
    # action (filtered to the same author, deduped against recency results).
    author_semantic_top_k: 15
    # How many wider-archive hits to pull by semantic similarity.
    wider_top_k: 15
    # If true, the author's own posts are eligible for the wider pass too
    # (and then deduped against the priors block). Previously hardcoded false.
    include_author_in_wider: true
    # If true, before embedding the action text we ask a small model to
    # generate 2-4 additional search queries (entities, prerequisites) to
    # broaden recall. Disable if latency/cost is a concern.
    expand_queries: true
    expansion_model: "mistralai/ministral-14b-2512"
    expansion_max_queries: 4
    # If true and the expansion call inferred an action_type, run one extra
    # wider-search pass filtered to that action_type. Only affects memories
    # ingested after the Archivist tag-block change shipped.
    action_type_boost: true

# --- MODEL & PROVIDER SETTINGS ---
models:
  provider:
    # LLM provider — any OpenAI-compatible API (OpenRouter, HuggingFace TGI, vLLM, etc.)
    base_url: "https://openrouter.ai/api/v1"
    # Optional headers forwarded to the provider (used by OpenRouter for attribution)
    site_url: "github.com/Shadowknight908/DNCbot"
    site_name: "DNC Lore Bot"
    # Embeddings provider — can be the same or a different endpoint.
    # Falls back to base_url if not set. Set EMBEDDING_API_KEY in .env for a separate key.
    embedding_base_url: ""
  
  # Default settings used when a mode field is left blank.
  defaults:
    model: "deepseek/deepseek-v4-flash"
    temperature: 0.7

  # Specialized models
  vision_model: "google/gemini-2.5-flash"
  embedding_model: "Qwen/Qwen3-Embedding-8B"

  # Per-mode LLM overrides. Leave blank to inherit defaults.
  # thinking_budget: controls thinking for capable models (Gemini, DeepSeek-R1, etc.)
  modes:
    chat:
      model: deepseek/deepseek-v4-flash
      temperature: 1.0
      top_p:
      top_k:
      max_tokens:
      thinking_budget: 0
    chatuc:
      model: nousresearch/hermes-4-405b
      temperature: 1.1
      top_p:
      top_k:
      max_tokens:
      thinking_budget:
    query:
      model: deepseek/deepseek-v4-flash
      temperature: 0.7
      top_p:
      top_k:
      max_tokens:
      thinking_budget: low
    gm:
      model: z-ai/glm-5.1
      temperature: 0.7
      top_p:
      top_k:
      max_tokens:
      thinking_budget: 1500
    archivist:
      model: mistralai/ministral-14b-2512
      temperature: 0.3
      top_p:
      top_k:
      max_tokens:
      thinking_budget:

# --- PERSISTENCE ---
memory:
  db_path: "./memory_store"
  # Search results per query
  top_k: 20
  # If true, drop summaries tagged NO_LORE
  filter_non_lore: true
  # How long voided memories stay recoverable
  void_retention_days: 30
  # Store original message text in metadata
  store_full_message: true

# Path to the chat blacklist file (created automatically if missing)
chat_blacklist_file: "chat_blacklist.txt"

# --- TAVILY WEB SEARCH ---
# The model decides when to call web_search; it is never called automatically.
# Only chat and chatuc modes support Tavily — query and gm always use ChromaDB only.
tavily:
  enabled_modes:
    chat: true
    chatuc: false
    mapparse: true
    mapchange: true
  max_results: 5
  search_depth: "basic"   # "basic" or "advanced"

# --- SPATIAL MAPPING ---
spatial_mapping:
  enabled: true
  # Channel where auto-rendered maps are posted.
  output_channel: "maps"
  # How often to auto-render and post a new map (hours).
  update_interval_hours: 24
  # Degrees of padding added around the target country for !DNC mapzoom.
  zoom_buffer_deg: 5.0
  # Path where auto-generated province definitions are stored.
  province_data_path: "map_data/provinces.json"
  # Path where province ownership state is persisted.
  province_ownership_path: "province_ownership.json"
  # Human-editable faction membership file used by !DNC mapfaction.
  factions_path: "factions"
  # Model for !DNC mapparse LLM analysis. null = use models.defaults.model.
  map_llm_model: moonshotai/kimi-k2.6
  # Ordered hex palette. Colors are assigned to tags in this order as nations
  # are first occupied; released and re-assigned fresh when a tag becomes vacant.
  # Edit this list to customize nation colors.
  color_palette:
    - "#e63946"
    - "#457b9d"
    - "#2a9d8f"
    - "#e9c46a"
    - "#f4a261"
    - "#6a4c93"
    - "#1982c4"
    - "#8ac926"
    - "#ff595e"
    - "#ffca3a"
    - "#06d6a0"
    - "#118ab2"
    - "#ef476f"
    - "#ffd166"
    - "#3a0ca3"
    - "#4cc9f0"
    - "#f72585"
    - "#7209b7"
    - "#560bad"
    - "#480ca8"

# --- ESPIONAGE SYSTEM ---
espionage:
  enabled: false
  # Channels where !DNC spy / counterspy / unspy / spylist can be used.
  # If empty, allowed from any channel.
  command_channels:
    - "intelligence"
  # Channels whose messages are checked for interception.
  # Typically your secret-actions channel(s).
  secret_channels:
    - "🤫secret-actions🤫"
  # Base interception probability (0–100 percent).
  base_chance: 30
  # Multiplier on base_chance when the TARGET has counterspy active.
  # 0.25 means only 25% of the normal chance (a 75% reduction).
  counterspy_multiplier: 0.25
  # Per-TAG additive modifier to base_chance.
  # Positive = easier to intercept (e.g. large signals apparatus leaks more).
  # Negative = harder to intercept (e.g. tight OPSEC).
  base_modifiers: {}
  #   USA: 15
  #   URS: 10
  #   GDR: -10

# --- SYSTEM PROMPTS ---
prompts:
  memory_extraction: "prompts/memory_extraction.txt"
  vision_extraction: "prompts/vision_extraction.txt"
  lore_query: "prompts/lore_query.txt"
  chat: "prompts/chat.txt"
  chat_unhinged: "prompts/chat_unhinged.txt"
  gm_ruling: "prompts/gm_ruling.txt"
